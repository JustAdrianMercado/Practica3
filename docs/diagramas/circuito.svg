<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080" viewBox="0 0 1480 1080" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Caja de los Enigmas — Circuito implementado</title>
  <desc id="descripcion">Montaje físico descrito y comprobado por el equipo, representado como esquema funcional y no como mapa físico de pines. El ESP32 DOIT DevKit V1 se alimenta por USB desde la computadora. El SG90 se conecta mediante Dupont: naranja a GPIO18, rojo a VIN y marrón a GND de la fila inferior del ESP32. No se conecta fuente externa ni capacitor. Se comprobó el giro del servo en ambos sentidos sin carga mecánica. El main.cpp actual utiliza las constantes de ConfiguracionHardware.h: 45 grados para cerrada y 135 para abierta. Arranca ordenando cerrar a 45 grados. Son valores provisionales del código, no una calibración física validada del mecanismo. El reed de dos cables grises se conecta así: cable 1 a protoboard a50, jumper b50 a GPIO4; cable 2 a a52, jumper b52 a GND de la fila superior del ESP32. a50 y b50 están conectados entre sí; a52 y b52 forman otro contacto. GPIO4 usa INPUT_PULLUP interno. Se comprobó físicamente LOW con imán cerca, correspondiente a tapa cerrada, y HIGH con imán lejos, correspondiente a tapa abierta. Los dos GND pertenecen a la misma referencia de la placa. El mecanismo de bloqueo todavía no fue probado. Para un mecanismo con mayor demanda de corriente se recomienda una fuente regulada independiente con GND común.</desc>
