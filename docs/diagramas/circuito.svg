<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080" viewBox="0 0 1480 1080" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Caja de los Enigmas: circuito previsto del ESP32, SG90 y reed</title>
  <desc id="descripcion">Esquema funcional, sin posiciones físicas de pines ni protoboard. El ESP32 recibe alimentación USB. GPIO18 controla la señal del SG90, alimentado por una fuente externa regulada de 5 V. GPIO4 se conecta mediante un reed de dos terminales a GND, con INPUT_PULLUP interno. La fuente, el servo, el ESP32 y el reed comparten GND. Un capacitor electrolítico opcional de 470 a 1000 microfaradios se conecta entre el positivo externo y GND, respetando su polaridad. Los positivos de USB y de la fuente externa no se unen.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #172c43; }
      .titulo { font-size: 30px; font-weight: 700; }
      .subtitulo { font-size: 17px; fill: #50647a; }
      .nombre { font-size: 23px; font-weight: 700; }
      .etiqueta { font-size: 19px; }
      .nota { font-size: 16px; }
      .pequena { font-size: 15px; }
      .terminal { fill: #fff; stroke: #172c43; stroke-width: 3; }
      .tierra { fill: none; stroke: #364152; stroke-width: 5; stroke-linejoin: round; }
      .positivo { fill: none; stroke: #c83340; stroke-width: 5; stroke-linejoin: round; }
      .senal { fill: none; stroke: #c87500; stroke-width: 5; stroke-linejoin: round; }
      .entrada { fill: none; stroke: #167a65; stroke-width: 5; stroke-linejoin: round; }
      .usb { fill: none; stroke: #306bc6; stroke-width: 7; }
    </style>
  </defs>
  <rect width="1480" height="1080" fill="#f5f8fc"/>
  <text x="60" y="51" class="titulo">Caja de los Enigmas · Circuito previsto</text>
  <text x="60" y="81" class="subtitulo">Esquema eléctrico funcional · Montaje, fuente, polaridad del reed y ángulos pendientes de verificación física</text>

  <rect x="100" y="120" width="260" height="65" rx="12" fill="#e6efff" stroke="#306bc6" stroke-width="2"/>
  <text x="230" y="148" class="etiqueta" text-anchor="middle">USB del ESP32</text>
  <text x="230" y="172" class="pequena" text-anchor="middle">Alimentación propia de la placa</text>
  <path d="M230 185 V230" class="usb"/>

  <rect x="80" y="230" width="330" height="360" rx="16" fill="#fff" stroke="#306bc6" stroke-width="3"/>
  <text x="110" y="273" class="nombre">ESP32</text>
  <text x="110" y="300" class="etiqueta">DOIT DevKit V1</text>
  <text x="390" y="346" class="etiqueta" text-anchor="end">GPIO18</text>
  <text x="110" y="390" class="pequena">Solo se muestran terminales usados.</text>
  <text x="390" y="434" class="etiqueta" text-anchor="end">GPIO4</text>
  <text x="110" y="480" class="nota">INPUT_PULLUP interno</text>
  <text x="110" y="505" class="pequena">No conectar el reed a +5 V.</text>
  <text x="110" y="545" class="pequena">3V3 y VIN/5V: sin conexión externa</text>
  <text x="230" y="575" class="etiqueta" text-anchor="middle">GND</text>

  <rect x="900" y="120" width="400" height="100" rx="14" fill="#fff" stroke="#c83340" stroke-width="3"/>
  <text x="1100" y="155" class="nombre" text-anchor="middle">Fuente externa regulada</text>
  <text x="1100" y="182" class="etiqueta" text-anchor="middle">Salida de 5 V CC · Por verificar</text>
  <text x="1000" y="208" class="nota" text-anchor="middle">+5 V</text>
  <text x="1250" y="208" class="nota" text-anchor="middle">GND / −</text>

  <rect x="900" y="340" width="300" height="230" rx="16" fill="#fff" stroke="#a16a16" stroke-width="3"/>
  <text x="1050" y="385" class="nombre" text-anchor="middle">Servomotor SG90</text>
  <text x="1020" y="415" class="nota" text-anchor="middle">Señal (S)</text>
  <text x="1020" y="440" class="pequena" text-anchor="middle">Normalmente naranja</text>
  <text x="1020" y="470" class="nota" text-anchor="middle">+ alimentación: rojo habitual</text>
  <text x="1020" y="495" class="nota" text-anchor="middle">− / GND: marrón habitual</text>
  <text x="1050" y="530" class="pequena" text-anchor="middle">Verificar el servo real: el color no basta.</text>
  <text x="1000" y="362" class="pequena" text-anchor="middle">+</text>
  <text x="1100" y="558" class="pequena" text-anchor="middle">GND</text>

  <rect x="500" y="570" width="260" height="160" rx="14" fill="#fff" stroke="#167a65" stroke-width="2"/>
  <text x="630" y="604" class="nombre" text-anchor="middle">Reed magnético</text>
  <text x="630" y="628" class="pequena" text-anchor="middle">Dos terminales · Imán externo</text>
  <path d="M500 665 H570 M570 665 L610 645 M630 665 H760" fill="none" stroke="#167a65" stroke-width="3"/>
  <circle cx="570" cy="665" r="4" fill="#167a65"/>
  <circle cx="630" cy="665" r="4" fill="#167a65"/>
  <text x="520" y="711" class="pequena">Dibujado abierto, no medido.</text>

  <rect x="1195" y="555" width="180" height="190" rx="12" fill="#fff7ed" stroke="#b88a46" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1285" y="583" class="nota" text-anchor="middle">Capacitor opcional</text>
  <text x="1285" y="606" class="nota" text-anchor="middle">470–1000 µF</text>
  <text x="1210" y="637" class="etiqueta">+</text>
  <text x="1210" y="674" class="etiqueta">−</text>
  <text x="1285" y="707" class="pequena" text-anchor="middle">Electrolítico polarizado</text>
  <text x="1285" y="730" class="pequena" text-anchor="middle">Tensión nominal &gt; 5 V</text>

  <path id="senal-servo" d="M410 350 H700 V420 H900" class="senal"/>
  <text x="485" y="334" class="nota">Señal de control · GPIO18</text>
  <path id="entrada-reed" d="M410 440 H470 V665 H500" class="entrada"/>
  <text x="500" y="481" class="nota">GPIO4 → contacto</text>
  <path id="alimentacion-servo" d="M1000 220 V340" class="positivo"/>
  <path id="positivo-capacitor" d="M1000 280 H1260 V540 H1380 V639 H1280" class="positivo"/>
  <text x="1060" y="268" class="nota">+5 V externo</text>
  <circle cx="1000" cy="280" r="7" fill="#c83340"/>
  <path d="M1240 639 H1320 M1240 668 Q1280 649 1320 668" fill="none" stroke="#364152" stroke-width="4"/>
  <path d="M1280 658 V680 H1380 V780 H1260 V840" class="tierra"/>
  <path id="retorno-fuente" d="M1250 220 H1400 V840" class="tierra"/>
  <path id="retorno-servo" d="M1100 570 V840" class="tierra"/>
  <path id="retorno-esp32" d="M230 590 V840" class="tierra"/>
  <path id="retorno-reed" d="M760 665 V840" class="tierra"/>
  <path id="gnd-comun" d="M230 840 H1400" class="tierra"/>
  <g fill="#364152">
    <circle cx="230" cy="840" r="7"/><circle cx="760" cy="840" r="7"/>
    <circle cx="1100" cy="840" r="7"/><circle cx="1260" cy="840" r="7"/>
    <circle cx="1400" cy="840" r="7"/>
  </g>
  <path d="M800 840 V863 M776 863 H824 M784 875 H816 M793 887 H807" class="tierra"/>
  <text x="60" y="878" class="etiqueta">GND común: ESP32 + fuente externa + servo + reed</text>
  <g class="terminal">
    <circle cx="230" cy="230" r="7"/>
    <circle cx="410" cy="350" r="7"/><circle cx="410" cy="440" r="7"/><circle cx="230" cy="590" r="7"/>
    <circle cx="1000" cy="220" r="7"/><circle cx="1250" cy="220" r="7"/>
    <circle cx="1000" cy="340" r="7"/><circle cx="900" cy="420" r="7"/><circle cx="1100" cy="570" r="7"/>
    <circle cx="500" cy="665" r="7"/><circle cx="760" cy="665" r="7"/>
  </g>
  <path d="M60 932 H110" class="senal"/><text x="122" y="938" class="nota">Señal servo</text>
  <path d="M310 932 H360" class="entrada"/><text x="372" y="938" class="nota">Entrada reed</text>
  <path d="M560 932 H610" class="positivo"/><text x="622" y="938" class="nota">+5 V externo</text>
  <path d="M810 932 H860" class="tierra"/><text x="872" y="938" class="nota">GND</text>
  <path d="M990 932 H1040" class="usb"/><text x="1052" y="938" class="nota">USB de la placa</text>
  <rect x="50" y="968" width="1380" height="84" rx="12" fill="#fff1f0" stroke="#c83340"/>
  <text x="70" y="996" class="etiqueta">No unir los positivos de USB y fuente externa. No llevar +5 V a 3V3 ni alimentar el servo desde GPIO.</text>
  <text x="70" y="1023" class="nota">Solo GND es común entre alimentaciones. Revisar todo sin energía antes de conectar USB y fuente; no hay mapa de protoboard.</text>
</svg>
