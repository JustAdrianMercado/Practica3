      .nombre { font-size: 23px; font-weight: 700; }
      .etiqueta { font-size: 19px; }
      .nota { font-size: 16px; }
      .pequena { font-size: 15px; }
      .terminal { fill: #fff; stroke: #172c43; stroke-width: 3; }
      .tierra { fill: none; stroke: #364152; stroke-width: 5; stroke-linejoin: round; }
      .positivo { fill: none; stroke: #c83340; stroke-width: 5; stroke-linejoin: round; }
      .senal { fill: none; stroke: #c87500; stroke-width: 5; stroke-linejoin: round; }
      .entrada { fill: none; stroke: #167a65; stroke-width: 5; stroke-linejoin: round; }
      .usb { fill: none; stroke: #306bc6; stroke-width: 7; }
    </style>
  </defs>
  <rect width="1480" height="1080" fill="#f5f8fc"/>
  <text x="60" y="51" class="titulo">Caja de los Enigmas — Circuito implementado</text>
  <text x="60" y="81" class="subtitulo">SIS-234 · Montaje real comunicado por el equipo · Esquema de terminales, no ubicación física de pines</text>

  <rect x="100" y="120" width="320" height="65" rx="12" fill="#e6efff" stroke="#306bc6" stroke-width="2"/>
  <text x="260" y="148" class="etiqueta" text-anchor="middle">Computadora → USB del ESP32</text>
  <text x="260" y="172" class="pequena" text-anchor="middle">Única alimentación del montaje</text>
  <path id="alimentacion-usb" d="M260 185 V230" class="usb"/>

  <rect x="900" y="115" width="440" height="80" rx="14" fill="#edf8f4" stroke="#167a65" stroke-width="2"/>
  <text x="1120" y="145" class="etiqueta" text-anchor="middle">Pruebas físicas realizadas por el equipo</text>
  <text x="1120" y="173" class="nota" text-anchor="middle">SG90: giro sin carga · Reed: LOW y HIGH comprobados</text>

  <rect x="80" y="230" width="360" height="550" rx="16" fill="#fff" stroke="#306bc6" stroke-width="3"/>
  <text x="110" y="273" class="nombre">ESP32</text>
  <text x="110" y="300" class="etiqueta">DOIT DevKit V1</text>
  <text x="420" y="344" class="etiqueta" text-anchor="end">GPIO18</text>
  <text x="110" y="389" class="pequena">Terminales usados en el montaje real</text>
  <text x="420" y="434" class="etiqueta" text-anchor="end">VIN → alimentación del servo</text>
  <text x="420" y="524" class="etiqueta" text-anchor="end">GND · fila inferior</text>
  <text x="110" y="578" class="pequena">3V3: sin conexión al servo ni al reed</text>
  <text x="420" y="634" class="etiqueta" text-anchor="end">GPIO4 · INPUT_PULLUP</text>
  <text x="420" y="724" class="etiqueta" text-anchor="end">GND · fila superior</text>
  <text x="110" y="760" class="pequena">Ambos GND comparten referencia en la placa.</text>

  <rect x="900" y="230" width="440" height="320" rx="16" fill="#fff" stroke="#a16a16" stroke-width="3"/>
  <text x="1120" y="272" class="nombre" text-anchor="middle">Servomotor SG90</text>
  <text x="1120" y="300" class="nota" text-anchor="middle">Conexiones mediante cables Dupont</text>
  <text x="925" y="344" class="etiqueta">Señal · cable naranja</text>
  <text x="1120" y="385" class="etiqueta" text-anchor="middle">45° cerrada (arranque) · 135° abierta</text>
  <text x="1120" y="410" class="pequena" text-anchor="middle">Valores del código; calibración mecánica pendiente</text>
  <text x="925" y="434" class="etiqueta">Alimentación · cable rojo</text>
  <text x="1120" y="472" class="nota" text-anchor="middle">Desde VIN del ESP32 alimentado por USB</text>
  <text x="925" y="504" class="etiqueta">GND · cable marrón</text>
  <text x="1120" y="534" class="pequena" text-anchor="middle">Movimiento comprobado en ambos sentidos, sin carga.</text>

  <path id="senal-servo" d="M440 350 H900" class="senal"/>
  <text x="500" y="334" class="nota">GPIO18 → naranja</text>
  <path id="alimentacion-servo" d="M440 440 H900" class="positivo"/>
  <text x="500" y="420" class="nota">VIN → rojo</text>
  <path id="retorno-servo" d="M440 530 H780 V510 H900" class="tierra"/>
  <text x="500" y="555" class="nota">GND de la fila inferior → marrón</text>

  <rect x="900" y="610" width="440" height="200" rx="14" fill="#fff" stroke="#167a65" stroke-width="2"/>
  <text x="1120" y="645" class="nombre" text-anchor="middle">Reed magnético · dos cables grises</text>
  <path d="M900 680 H1030 M1030 680 L1070 660 M1090 680 H1260 V730 H900" fill="none" stroke="#167a65" stroke-width="3"/>
  <circle cx="1030" cy="680" r="4" fill="#167a65"/>
  <circle cx="1090" cy="680" r="4" fill="#167a65"/>
  <text x="925" y="707" class="pequena">Símbolo representado con el contacto abierto.</text>
  <text x="925" y="764" class="nota">LOW = imán cerca → tapa cerrada</text>
  <text x="925" y="788" class="nota">HIGH = imán lejos → tapa abierta</text>

  <path id="entrada-reed" d="M440 640 H700 V680 H900" class="entrada"/>
  <text x="500" y="620" class="nota">GPIO4 → b50 ↔ a50 → cable gris 1</text>
  <path id="retorno-reed" d="M440 730 H900" class="tierra"/>
  <text x="500" y="755" class="nota">GND superior → b52 ↔ a52 → cable gris 2</text>

  <g class="terminal">
    <circle cx="260" cy="230" r="7"/>
    <circle cx="440" cy="350" r="7"/><circle cx="900" cy="350" r="7"/>
    <circle cx="440" cy="440" r="7"/><circle cx="900" cy="440" r="7"/>
    <circle cx="440" cy="530" r="7"/><circle cx="900" cy="510" r="7"/>
    <circle cx="440" cy="640" r="7"/><circle cx="900" cy="680" r="7"/>
    <circle cx="440" cy="730" r="7"/><circle cx="900" cy="730" r="7"/>
  </g>

  <rect x="60" y="836" width="1360" height="88" rx="12" fill="#fff" stroke="#c8d3e1" stroke-width="2"/>
  <text x="80" y="863" class="etiqueta">Protoboard y alcance de la prueba</text>
  <text x="80" y="889" class="nota">Gris 1 → a50; jumper b50 → GPIO4. Gris 2 → a52; jumper b52 → GND de la fila superior.</text>
  <text x="80" y="912" class="pequena">a50 ↔ b50 y a52 ↔ b52 son contactos separados. El mecanismo de bloqueo de la caja todavía no fue probado.</text>

  <path d="M60 954 H110" class="senal"/><text x="122" y="960" class="nota">Señal SG90</text>
  <path d="M310 954 H360" class="entrada"/><text x="372" y="960" class="nota">Entrada reed</text>
  <path d="M560 954 H610" class="positivo"/><text x="622" y="960" class="nota">Alimentación desde VIN</text>
  <path d="M870 954 H920" class="tierra"/><text x="932" y="960" class="nota">GND</text>
  <path d="M1060 954 H1110" class="usb"/><text x="1122" y="960" class="nota">USB de la placa</text>

</svg>
