[platformio]
default_envs = servo, reed
src_dir = ..
include_dir = ../include

[env]
platform = espressif32@7.0.1
platform_packages = platformio/framework-arduinoespressif32@3.20017.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter

[env:servo]
build_src_filter =
    -<*>
    +<pruebas/servo/main.cpp>
lib_deps = madhephaestus/ESP32Servo@3.0.6

[env:reed]
build_src_filter =
    -<*>
    +<pruebas/reed/main.cpp>
    +<src/SensorTapa.cpp>
