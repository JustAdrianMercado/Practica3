; Firmware del objeto inteligente "Caja de los Enigmas" (ESP32 DOIT DEVKIT V1).
; Ejecutar desde esta carpeta: pio run / pio run -t upload / pio device monitor
; Documentacion: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = caja

[env:caja]
; Versiones fijadas (igual que en la Practica 2) para que la compilacion sea reproducible.
platform = espressif32@7.0.1
platform_packages = platformio/framework-arduinoespressif32@3.20017.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter
lib_deps =
    256dpi/MQTT@2.5.2
    bblanchon/ArduinoJson@7.2.1
    madhephaestus/ESP32Servo@3.0.6
